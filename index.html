  <!-- DL IPTV Rebranding & Pricing Override -->
  <script>
  (function() {
    const BRAND = 'DL IPTV';
    const TELEGRAM = 'https://t.me/DL_IPTV';
    const WHATSAPP = 'https://wa.me/YOURNUMBER'; // Replace with your WhatsApp

    // Pricing — 1 connection base, scale for multi
    const PRICING = {
      '1connection': {
        monthly: '$12',
        quarterly: '$30',
        semiannual: '$54',
        annual: '$96'
      },
      '2connection': {
        monthly: '$18',
        quarterly: '$45',
        semiannual: '$81',
        annual: '$144'
      }
    };

    function rebrand(node) {
      if (node.nodeType === 3) {
        // Text nodes: replace brand names
        var t = node.nodeValue;
        t = t.replace(/NIXATV/gi, BRAND);
        t = t.replace(/nixatv\.com/gi, 'dliptv.com');
        t = t.replace(/\+1 647 366 5409/g, '@DL_IPTV on Telegram');
        t = t.replace(/NIXATV Media/gi, 'DL IPTV');
        t = t.replace(/\$19\.99/g, PRICING['1connection'].monthly);
        t = t.replace(/\$49\.99/g, PRICING['1connection'].quarterly);
        t = t.replace(/\$89\.99/g, PRICING['1connection'].semiannual);
        t = t.replace(/\$149\.99/g, PRICING['1connection'].annual);
        // Catch any remaining $XX.99 prices and scale down
        node.nodeValue = t;
      }
      if (node.nodeType === 1 && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
        // Replace NIXATV logo references
        if (node.hasAttribute('src') && node.getAttribute('src').indexOf('supabase') !== -1) {
          node.setAttribute('src', 'logo.png');
        }
        // Route "Contact Us" / "Support" links to Telegram
        if (node.hasAttribute('href')) {
          var href = node.getAttribute('href');
          if (href.indexOf('/contact') !== -1 || href.indexOf('/support') !== -1 || href.indexOf('mailto:') !== -1) {
            node.setAttribute('href', TELEGRAM);
            node.setAttribute('target', '_blank');
          }
          if (href.indexOf('twitter.com/nixatv') !== -1 || href.indexOf('facebook.com/nixatv') !== -1) {
            node.setAttribute('href', TELEGRAM);
            node.setAttribute('target', '_blank');
          }
        }
        // Override pricing cards in the DOM
        if (node.textContent) {
          var txt = node.textContent;
          // Detect pricing patterns and replace
          if (txt.match(/\$\d+\.?\d*/) && (txt.match(/month/i) || txt.match(/year/i) || txt.match(/quarter/i) || txt.match(/connection/i))) {
            // The Pricing component uses specific classes — let the CSS handle it
          }
        }
        for (var c of node.childNodes) rebrand(c);
      }
    }

    // Run multiple times — React renders async
    function run() {
      rebrand(document.body);
    }

    setTimeout(run, 800);
    setTimeout(run, 2000);
    setTimeout(run, 4000);
    setInterval(run, 2000);
  })();
